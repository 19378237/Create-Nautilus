plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

tasks.matching { it.name in ['jar', 'sourcesJar'] }.configureEach {
    from('LICENSE')
    from('THIRD_PARTY.md')
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }

    exclusiveContent {
        forRepositories(
                maven { name = 'IThundxrHidden'; url = 'https://maven.ithundxr.dev/hidden' },
                maven { name = 'IThundxrSnapshots'; url = 'https://maven.ithundxr.dev/snapshots' }
        )
        filter { includeGroup 'com.tterrag.registrate' }
    }

    exclusiveContent {
        forRepository {
            maven { name = 'RyanHCode'; url = 'https://maven.ryanhcode.dev/releases' }
        }
        filter { includeGroupAndSubgroups 'dev.ryanhcode' }
    }

    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath,
                    '--existing-mod', 'create'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Create's support libraries are declared explicitly.
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    localRuntime "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"

    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'foundry.veil'
        exclude group: 'com.tterrag.registrate'
    }
    // Sable exposes Veil types; the runtime supplies Veil through Sable/Aeronautics.
    compileOnly "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"

    // Optional client integration: Iris is neither required nor bundled.
    compileOnly("maven.modrinth:iris:${iris_version}") {
        transitive = false
    }

    implementation "maven.modrinth:create-aeronautics:${aeronautics_version}"
}

def metadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        create_mod_version     : create_mod_version,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
]

tasks.withType(ProcessResources).configureEach {
    inputs.properties metadataProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand metadataProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// Source archives are not installable mods: keep unexpanded loader metadata out.
tasks.named('sourcesJar', Jar).configure {
    exclude 'META-INF/**'
    exclude 'pack.mcmeta'
    exclude '*.mixins.json'
    exclude 'assets/**'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
