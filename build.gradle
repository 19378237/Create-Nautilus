            }

            // Identical native sources and options must remain byte-for-byte stable across reloads
            // so Iris and the driver can reuse their source-keyed caches. Each Program still owns
            // its distinct generation, and later option snapshots cannot mutate an older pipeline.
            final def currentBuildGeneration = adapter.getMethod(
                    'currentBuildGeneration')
            final def adapterReadyFor = adapter.getMethod(
                    'adapterReady', Integer.TYPE)
            beginReloadTemporal.invoke(null, -1, 0, 0, 0, -1, Float.NaN)
            final int cachedGeneration = (Integer) currentBuildGeneration.invoke(null)
            final String cachedFront = (String) patchFragment.invoke(
                    null, photonFrontVl, 'composite')
            if (cachedFront == photonFrontVl) {
                throw new GradleException('Cached Photon fixture did not patch')
            }
            final String cachedBlend = (String) patchFragment.invoke(
                    null, photonWithPackDirectives, 'composite')
            if (cachedBlend == photonWithPackDirectives) {
                throw new GradleException('Cached Photon c1 fixture did not patch')
            }
            finishPhotonReload.invoke(null)
            if (!(Boolean) adapterReadyFor.invoke(null, cachedGeneration)) {
                throw new GradleException('Cached Photon generation was not published as ready')
            }
            confirmLinkedConsumer.invoke(null, cachedGeneration)
            final Object cachedTransform = sceneDepthTransform.invoke(
                    null, cachedGeneration, 1, 854, 480)
            if (cachedTransform == null) {
                throw new GradleException('Cached Photon generation lost its option snapshot')
            }

            beginReloadTemporal.invoke(null, -1, 0, 0, 0, -1, Float.NaN)
            final int repeatedGeneration = (Integer) currentBuildGeneration.invoke(null)
            final String repeatedFront = (String) patchFragment.invoke(
                    null, photonFrontVl, 'composite')
            final String repeatedBlend = (String) patchFragment.invoke(
                    null, photonWithPackDirectives, 'composite')
            finishPhotonReload.invoke(null)
            if (repeatedGeneration <= cachedGeneration
                    || !(Boolean) adapterReadyFor.invoke(null, repeatedGeneration)
                    || repeatedFront != cachedFront || repeatedBlend != cachedBlend) {
                throw new GradleException('Identical Photon reloads must publish distinct ready '
                        + 'generations while emitting byte-for-byte identical GLSL')
            }

            final String photonFrontTaa = photonFrontVl.replace(
                    'in vec2 uv;', 'uniform vec2 taa_offset;\nin vec2 uv;\n'
                            + 'vec2 jitter_offset = taa_offset * 0.66;')
            final String photonBlendTaa = photonWithPackDirectives.replace(
                    'in vec2 uv;', 'uniform vec2 taa_offset;\nin vec2 uv;\n'
                            + 'vec2 jitter_offset = taa_offset * 0.66;')
            beginReloadTemporal.invoke(null, -1, 0, 1, 0, -1, Float.NaN)
            final int changedOptionGeneration = (Integer) currentBuildGeneration.invoke(null)
            final String changedFront = (String) patchFragment.invoke(
                    null, photonFrontTaa, 'composite')
            final String changedBlend = (String) patchFragment.invoke(
                    null, photonBlendTaa, 'composite')
            finishPhotonReload.invoke(null)
            final Object preservedTransform = sceneDepthTransform.invoke(
                    null, cachedGeneration, 1, 854, 480)
            if (changedOptionGeneration <= repeatedGeneration
                    || !(Boolean) adapterReadyFor.invoke(null, changedOptionGeneration)
                    || changedFront == cachedFront || changedBlend == cachedBlend
                    || preservedTransform == null
                    || preservedTransform.class.getMethod('scale').invoke(preservedTransform)
                    != cachedTransform.class.getMethod('scale').invoke(cachedTransform)
                    || preservedTransform.class.getMethod('offsetU').invoke(preservedTransform)
                    != cachedTransform.class.getMethod('offsetU').invoke(cachedTransform)
                    || preservedTransform.class.getMethod('offsetV').invoke(preservedTransform)
                    != cachedTransform.class.getMethod('offsetV').invoke(cachedTransform)) {
                throw new GradleException('A later Photon option snapshot must not overwrite '
                        + 'the depth transform owned by an older cached generation')
            }
            confirmLinkedConsumer.invoke(null, changedOptionGeneration)
            final Object changedTransform = sceneDepthTransform.invoke(
                    null, changedOptionGeneration, 1, 854, 480)
            if (changedTransform == null
                    || changedTransform == cachedTransform) {
                throw new GradleException('Enabling Photon TAA must keep its own changed '
                        + 'depth transform instead of reusing the older no-TAA snapshot')
            }

            // Unsupported later pipelines must not invalidate an already cached Photon generation.
            beginReloadTemporal.invoke(null, -1, 0, 0, 0, -1, Float.NaN)
            final int unsupportedGeneration = (Integer) currentBuildGeneration.invoke(null)
            patchFragment.invoke(null, blissNative, 'composite')
            finishPhotonReload.invoke(null)
            if ((Boolean) adapterReadyFor.invoke(null, unsupportedGeneration)
                    || !(Boolean) adapterReadyFor.invoke(null, cachedGeneration)) {
                throw new GradleException('An unsupported later pipeline must remain native '
                        + 'without invalidating an already linked Photon generation')
            }
        } finally {
            loader.close()
        }
        logger.lifecycle('Iris shader patch safety passed: Photon c0 front raymarch plus c1 '
                + 'ordered translucent blending, atomic generation binding, native fallback '
                + 'and no post-AST rewrite')
    }
}

apply from: 'gradle/verify-fog-compat.gradle'
apply from: 'gradle/verify-virtual-water-material.gradle'
apply from: 'gradle/verify-virtual-water-mesh.gradle'
apply from: 'gradle/verify-water-view-transform.gradle'
apply from: 'gradle/verify-physics-state.gradle'
apply from: 'gradle/verify-gas-transfer.gradle'
apply from: 'gradle/verify-network-lifecycle.gradle'

tasks.named('check').configure {
    dependsOn tasks.named('verifyPhysicsState')
    dependsOn tasks.named('verifyGasTransfer')
    dependsOn tasks.named('verifyNetworkLifecycle')
    dependsOn tasks.named('verifyVirtualWaterMaterial')
    dependsOn tasks.named('verifyVirtualWaterMesh')
    dependsOn tasks.named('verifyWaterViewTransform')
    dependsOn verifyVoxelAtlasPacking
    dependsOn verifyApertureEntryDepth
    dependsOn verifyMixinSourceSafety
    dependsOn verifyIrisShaderPatchSafety
}

// A sources archive is documentation, not an installable mod. Gradle's default
// sourcesJar also copies resources, which would leave the unexpanded
// ${mod_id} template in META-INF/neoforge.mods.toml. If a user accidentally put
// that archive in mods/, NeoForge would try to parse it and abort discovery.
// Keep source archives source-only so an accidental copy is ignored safely.
tasks.named('sourcesJar', Jar).configure {
    exclude 'META-INF/**'
    exclude 'pack.mcmeta'
    exclude '*.mixins.json'
    exclude 'assets/**'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
