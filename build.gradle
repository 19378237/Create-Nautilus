                final int directionCode = axis * 2 + positive + 1
                final int decodedAxis = Math.floorDiv(directionCode - 1, 2)
                final int decodedPositive = Math.floorMod(directionCode - 1, 2)
                assert decodedAxis == axis
                assert decodedPositive == positive
            }
        }

        // Mirror the connected full-block membrane rim rule on a 3x3 sheet. Every cell keeps
        // its normal axis; exposed edge cells add one tangent axis and corners add two. A tangent
        // event must always point away from the sheet, never into an adjacent glass cell.
        final Set<List<Integer>> membraneSheet = new LinkedHashSet<>()
        (0..2).each { int u ->
            (0..2).each { int v -> membraneSheet.add([u, v]) }
        }
        final Map<List<Integer>, Integer> membraneAxisCounts = new LinkedHashMap<>()
        int membraneRimEvents = 0
        membraneSheet.each { List<Integer> cell ->
            final int u = cell[0]
            final int v = cell[1]
            int axisCount = 1
            final boolean negativeU = membraneSheet.contains([u - 1, v])
            final boolean positiveU = membraneSheet.contains([u + 1, v])
            if (negativeU != positiveU) {
                final List<Integer> target = negativeU ? [u + 1, v] : [u - 1, v]
                assert !membraneSheet.contains(target)
                axisCount++
                membraneRimEvents++
            }
            final boolean negativeV = membraneSheet.contains([u, v - 1])
            final boolean positiveV = membraneSheet.contains([u, v + 1])
            if (negativeV != positiveV) {
                final List<Integer> target = negativeV ? [u, v + 1] : [u, v - 1]
                assert !membraneSheet.contains(target)
                axisCount++
                membraneRimEvents++
            }
            membraneAxisCounts.put(cell, axisCount)
        }
        assert membraneAxisCounts.get([1, 1]) == 1
        assert membraneAxisCounts.findAll { cell, count -> count == 2 }.size() == 4
        assert membraneAxisCounts.findAll { cell, count -> count == 3 }.size() == 4
        assert membraneRimEvents == 12

        // A precise primary optical voxel wins before any neighbour is considered. Recovery
        // decodes only the exact signed direction and only along its normal axis; two genuine
        // candidates for that same direction remain ambiguous.
        final def resolveOpticalSlotFixture = {
                Integer primaryGroup, Integer directionCode,
                List<Map<String, Integer>> candidates ->
            final Integer primarySlot = decodeDirectionSlot(
                    primaryGroup, directionCode) as Integer
            if (primarySlot != null) {
                return [slot: primarySlot, conflict: false, searched: false]
            }
            final int expectedAxis = Math.floorDiv(directionCode - 1, 2)
            Integer selected = null
            boolean conflict = false
            candidates.each { Map<String, Integer> candidate ->
                if (candidate.offsetAxis != expectedAxis) return
                final Integer slot = decodeDirectionSlot(
                        candidate.group, directionCode) as Integer
                if (slot == null) return
                if (selected != null && selected != slot) conflict = true
                else selected = slot
            }
            return [slot: selected, conflict: conflict, searched: true]
        }
