def verifyIrisShaderPatchSafety = tasks.register('verifyIrisShaderPatchSafety') {
    group = 'verification'
    description = 'Reject post-preprocess Iris adapter output containing conditional directives.'
    dependsOn tasks.named('classes')
    doLast {
        final File adapterFile = file(
                'src/main/java/com/create/nautilus/client/render/IrisCompositeShaderSource.java')
        final String adapterSource = adapterFile.getText('UTF-8')
        final def directiveLine = ~/(?m)^\s*#\s*(?:if|ifdef|ifndef|elif|else|endif)\b/
        final def directiveMatcher = directiveLine.matcher(adapterSource)
        if (directiveMatcher.find()) {
            final int line = adapterSource.substring(0, directiveMatcher.start())
                    .count('\n') + 1
            throw new GradleException('Iris adapter templates run after shader-pack preprocessing; '
                    + "conditional directive found at ${project.relativePath(adapterFile)}:${line}")
        }
        if (!adapterSource.contains('CONDITIONAL_PREPROCESSOR_DIRECTIVE')
                || !adapterSource.contains('reintroduced ')
                || !adapterSource.contains(
                'a conditional preprocessor directive after Iris preprocessing')) {
            throw new GradleException('Iris adapter runtime must fail open if a generated patch '
                    + 'reintroduces a conditional preprocessor directive')
        }

        final String mixinConfig = file('src/main/resources/create_nautilus.mixins.json')
                .getText('UTF-8')
        if (mixinConfig.contains('client.IrisProgramBuilderMixin')) {
            throw new GradleException('Post-AST Iris ProgramBuilder source rewriting must remain '
                    + 'unregistered; all adapter injection belongs at the pre-AST boundary')
        }
        final String legacyBuilder = file(
                'src/main/java/com/create/nautilus/mixin/client/IrisProgramBuilderMixin.java')
