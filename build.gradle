        // slot and X-/X+/Y-/Y+/Z-/Z+ presence bits; offsets count present lower directions.
        // Use floorDiv here to retain GLSL integer-division semantics in the Groovy fixture.
        final int directionSlotGroupSize = 64
        final def decodeDirectionSlot = { Integer group, Integer directionCode ->
            if (group == null || group < 0 || directionCode == null
                    || directionCode < 1 || directionCode > 6) {
                return null
            }
            final int firstSlot = Math.floorDiv(group, directionSlotGroupSize)
            final int directionBits = group - firstSlot * directionSlotGroupSize
            if (directionBits < 1 || directionBits > 63) return null
            int remainingBits = directionBits
            int offset = 0
            for (int code = 1; code <= 6; code++) {
                final int present = remainingBits - Math.floorDiv(remainingBits, 2) * 2
                if (code == directionCode) return present != 0 ? firstSlot + offset : null
                offset += present
                remainingBits = Math.floorDiv(remainingBits, 2)
            }
            return null
        }
        final int xBothZPositiveGroup = 7 * directionSlotGroupSize + 35
        final int allDirectionsGroup = 11 * directionSlotGroupSize + 63
        assert decodeDirectionSlot(xBothZPositiveGroup, 1) == 7
        assert decodeDirectionSlot(xBothZPositiveGroup, 2) == 8
        assert decodeDirectionSlot(xBothZPositiveGroup, 3) == null
        assert decodeDirectionSlot(xBothZPositiveGroup, 6) == 9
